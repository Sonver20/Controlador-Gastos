<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradês Neon (Roxo Elétrico e Ciano) -->
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B4FE" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>

    <!-- Efeito de Brilho Neon (Glow) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo escuro arredondado (Base do Ícone do App) -->
  <rect width="512" height="512" rx="112" fill="#0F0D1A" />

  <!-- Moldura Geométrica Externa (Hexágono Cyberpunk) -->
  <polygon points="256,56 426,154 426,358 256,456 86,358 86,154" 
           fill="none" 
           stroke="url(#neonPurple)" 
           stroke-width="12" 
           stroke-linejoin="round"
           filter="url(#glow)" 
           opacity="0.85" />

  <!-- Contorno Externo do Olho do Dragão -->
  <path d="M 106,256 C 176,150 336,150 406,256 C 336,362 176,362 106,256 Z" 
        fill="none" 
        stroke="url(#neonCyan)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Anel do Íris Geométrico -->
  <circle cx="256" cy="256" r="68" 
          fill="none" 
          stroke="url(#neonPurple)" 
          stroke-width="8" 
          stroke-dasharray="20 12" 
          filter="url(#glow)" />

  <!-- Pupila Vertical de Réptil/Dragão -->
  <polygon points="256,170 276,256 256,342 236,256" 
           fill="url(#neonCyan)" 
           filter="url(#glow)" />

  <!-- Ponto de Brilho/Reflexo de Precisão -->
  <circle cx="236" cy="226" r="10" fill="#FFFFFF" opacity="0.9" />
</svg>
